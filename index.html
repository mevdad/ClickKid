<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd9ec" />
    <meta name="description" content="Дитяча гра: відкрий яйце з сюрпризом — зніми фольгу, розбий шоколад і дістань іграшку." />
    <title>Яйце з сюрпризом</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <header id="hud">
        <p id="hint">Натискай на яйце!</p>
        <div id="progress" aria-hidden="true"></div>
      </header>

      <button id="repeat" type="button" aria-label="Повторити завдання">🗣️</button>
      <button id="mute" type="button" aria-label="Вимкнути звук">🔊</button>

      <div id="reveal" class="card hidden">
        <p class="reveal-title">Ура! Це</p>
        <p id="figure-name" class="reveal-name">Бджілка</p>
        <button id="again" type="button" class="big-button">Відкрити ще яйце!</button>
      </div>

      <div id="start" class="overlay">
        <div class="card">
          <h1>Яйце з сюрпризом</h1>
          <p class="subtitle">Зніми фольгу, розбий шоколад і відкрий контейнер — всередині іграшка!</p>
          <button id="play" type="button" class="big-button">Грати!</button>
        </div>
      </div>

      <div id="loading" class="overlay hidden">
        <div class="spinner" role="status" aria-label="Завантаження"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
